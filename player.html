<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Seriály | Přehrávač</title>
    <script>
      (function () {
        const path = window.location.pathname;
        const lastSegment = path.split('/').pop() || '';
        const looksLikeFile = lastSegment.includes('.');

        if (!path.endsWith('/') && !looksLikeFile) {
          window.location.replace(`${path}/${window.location.search}${window.location.hash}`);
        }
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="public/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
  </head>
  <body data-page="player">
    <nav class="navbar navbar-expand-lg app-navbar">
      <div class="container d-flex align-items-center">
        <a class="navbar-brand fw-semibold me-3 mb-0" href="index.html">
          <i class="bi bi-film me-2"></i>
          Seriály
        </a>
        <button
          id="themeToggle"
          class="btn btn-link text-decoration-none p-2 ms-auto"
          type="button"
          aria-label="Přepnout motiv"
        >
          <i class="bi bi-brightness-high-fill"></i>
        </button>
      </div>
    </nav>

    <main class="container py-3 py-lg-4">
      <div id="mainContent"></div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="public/app.js"></script>
  </body>
</html>
